name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      # check formatting and errors
      - name: Ruff check
        run: python -m ruff check .

      - name: Ruff formatting
        run: python -m ruff format --check .

      # train both versions
      - name: Train v0.1
        run: python -m src.train

      - name: Train v0.2
        run: python -m src.train_v2

      # run the tests
      - name: Run tests
        run: python -m pytest -v

      # Save v0.1 training results
      - name: Upload v0.1 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: training-results-v0.1
          path: |
            models/model_v0_1.joblib
            metrics/metrics.json
          if-no-files-found: error

      # save v0.2 files
      - name: Upload v0.2 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: training-results-v0.2
          path: |
            models/model_v0_2.joblib
            metrics/metrics_v0_2.json
          if-no-files-found: error
