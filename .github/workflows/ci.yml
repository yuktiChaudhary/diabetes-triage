
name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      # Check the code before running the tests
      - name: Ruff check
        run: python -m ruff check .

      - name: Ruff formatting
        run: python -m ruff format --check .

      # Train the baseline v0.1 model
      - name: Train v0.1 model
        run: python -m src.train

      # Run automated tests
      - name: Run tests
        run: python -m pytest -v

      # Save v0.1 training results
      - name: Upload v0.1 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: training-results-v0.1
          path: |
            models/model_v0_1.joblib
            metrics/metrics.json
          if-no-files-found: error

