name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build docker image
      - name: Build image
        run: docker build -t diabetes-triage:${{ github.ref_name }} .

      # Test the container
      - name: Test container
        run: |
          docker run -d --name test-container -p 80:80 diabetes-triage:${{ github.ref_name }}
          sleep 10

          curl -f http://localhost:80/health
          curl -f http://localhost:80/predict \
            -H "Content-Type: application/json" \
            -d '{"age":0.02,"sex":-0.044,"bmi":0.06,"bp":-0.03,"s1":-0.02,"s2":0.03,"s3":-0.02,"s4":0.02,"s5":0.02,"s6":-0.001}'
          
          # Check that missing features return HTTP 422
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST http://localhost:80/predict \
            -H "Content-Type: application/json" \
            -d '{"age":0.02,"sex":-0.044,"bmi":0.06,"bp":-0.03,"s1":-0.02,"s2":0.03,"s3":-0.02,"s4":0.02,"s5":0.02}')

          test "$STATUS" = "422"
          docker stop test-container

      # Push to GHCR
      - name: Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${{ github.ref_name }}
          docker tag diabetes-triage:${{ github.ref_name }} "$IMAGE"
          docker push "$IMAGE"

      # Make GitHub release
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file CHANGELOG.md \
            metrics/metrics.json
