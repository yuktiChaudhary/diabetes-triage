name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      # Train the correct model for the release version
      - name: Train model
        env:
          MODEL_VERSION: ${{ github.ref_name }}
        run: |
          set -e

          if [ "$MODEL_VERSION" = "v0.1" ]; then
            rm -f models/model_v0_1.joblib metrics/metrics.json
            python -m src.train

          elif [ "$MODEL_VERSION" = "v0.2" ]; then
            rm -f models/model_v0_1.joblib metrics/metrics.json
            rm -f models/model_v0_2.joblib metrics/metrics_v0_2.json
            python -m src.train
            python -m src.train_v2

          else
            echo "Unsupported model version: $MODEL_VERSION"
            exit 1
          fi

      # Verify that training generated the required files
      - name: Verify training artifacts
        env:
          MODEL_VERSION: ${{ github.ref_name }}
        run: |
          if [ "$MODEL_VERSION" = "v0.1" ]; then
            test -f models/model_v0_1.joblib
            test -f metrics/metrics.json
          else
            test -f models/model_v0_2.joblib
            test -f metrics/metrics_v0_2.json
          fi

      # Build Docker image with the correct model version
      - name: Build Docker image
        env:
          MODEL_VERSION: ${{ github.ref_name }}
        run: |
          docker build --build-arg MODEL_VERSION="$MODEL_VERSION" \
            -t "diabetes-triage:$MODEL_VERSION" .

      # Run and test the Docker container
      - name: Test container
        env:
          MODEL_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          docker run -d --name test-container \
            -p 80:80 "diabetes-triage:$MODEL_VERSION"

          # Wait for the API to start
          for i in {1..30}; do
            if curl -fsS http://localhost:80/health > /dev/null; then
              break
            fi

            if [ "$i" -eq 30 ]; then
              docker logs test-container
              exit 1
            fi

            sleep 1
          done

          # Verify health status and model version
          curl -fsS http://localhost:80/health \
            | python -c 'import json,sys,os; d=json.load(sys.stdin); assert d["status"]=="ok"; assert d["model_version"]==os.environ["MODEL_VERSION"]'

          # Verify the prediction is a finite number
          curl -fsS -X POST http://localhost:80/predict \
            -H "Content-Type: application/json" \
            -d '{"age":0.02,"sex":-0.044,"bmi":0.06,"bp":-0.03,"s1":-0.02,"s2":0.03,"s3":-0.02,"s4":0.02,"s5":0.02,"s6":-0.001}' \
            | python -c 'import json,sys,math; d=json.load(sys.stdin); assert isinstance(d["prediction"],(int,float)); assert math.isfinite(d["prediction"])'

          # Verify that a missing feature returns HTTP 422
          STATUS=$(curl -sS -o error.json -w "%{http_code}" \
            -X POST http://localhost:80/predict \
            -H "Content-Type: application/json" \
            -d '{"age":0.02,"sex":-0.044,"bmi":0.06,"bp":-0.03,"s1":-0.02,"s2":0.03,"s3":-0.02,"s4":0.02,"s5":0.02}')

          test "$STATUS" = "422"

          # Verify the JSON error identifies missing s6
          python -c 'import json; d=json.load(open("error.json")); assert any("s6" in str(e.get("loc",[])) for e in d["detail"])'

      # Always clean up the test container
      - name: Stop test container
        if: always()
        run: docker rm -f test-container || true

      # Login to GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Publish the versioned Docker image
      - name: Push Docker image
        env:
          MODEL_VERSION: ${{ github.ref_name }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:$MODEL_VERSION"
          docker tag "diabetes-triage:$MODEL_VERSION" "$IMAGE"
          docker push "$IMAGE"

      # Create GitHub Release using the shared CHANGELOG
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL_VERSION: ${{ github.ref_name }}
        run: |
          if [ "$MODEL_VERSION" = "v0.1" ]; then
            METRICS=metrics/metrics.json
          else
            METRICS=metrics/metrics_v0_2.json
          fi

          gh release create "$MODEL_VERSION" \
            --title "$MODEL_VERSION" \
            --notes-file CHANGELOG.md \
            "$METRICS"
